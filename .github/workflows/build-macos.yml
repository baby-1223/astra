name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GitHub 的 macOS arm64 托管机池偶发容量不足，排队 15 分钟后会把任务直接取消
  # （annotation: "The job was not acquired by Runner of type hosted"）。
  # 主任务失败时用 Intel 机池再跑一次；Flutter 产物是 x86_64 + arm64 通用二进制，
  # 两个机池构建出的应用功能一致。
  build-macos:
    uses: ./.github/workflows/build-macos-app.yml
    with:
      runner: macos-latest
    secrets: inherit

  build-macos-intel-fallback:
    needs: build-macos
    # 排队超时被 GitHub 取消时 failure() 为 false，必须用 always() 判断结果。
    if: always() && needs.build-macos.result != 'success'
    uses: ./.github/workflows/build-macos-app.yml
    with:
      runner: macos-26-intel
    secrets: inherit
