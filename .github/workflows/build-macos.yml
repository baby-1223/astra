name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: 查看 Flutter 版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      - name: 构建 macOS Release
        run: flutter build macos --release

      - name: 校验产物架构
        run: |
          APP="build/macos/Build/Products/Release/Astra.app"
          if [ ! -d "$APP" ]; then
            echo "未找到 $APP"
            exit 1
          fi
          lipo -info "$APP/Contents/MacOS/Astra"

      - name: 打包产物
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Astra.app \
            dist/Astra-macos.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Astra-macos
          path: dist/Astra-macos.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Astra-macos.zip
          generate_release_notes: true
