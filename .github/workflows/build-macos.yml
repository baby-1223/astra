name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_PATH: build/macos/Build/Products/Release/Astra.app
  MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
  MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: 查看 Flutter 版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      - name: 构建 macOS Release
        run: flutter build macos --release

      - name: 校验产物架构
        run: |
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"
            exit 1
          fi
          lipo -info "$APP_PATH/Contents/MacOS/Astra"

      - name: 导入签名证书
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$MACOS_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: 使用 Developer ID 签名
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -n 1 \
            | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "未在钥匙串中找到 Developer ID Application 证书"
            exit 1
          fi
          echo "签名身份：$IDENTITY"
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: 打包（公证用）
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Astra-macos.zip

      - name: 提交 Apple 公证
        if: env.MACOS_CERT_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool submit dist/Astra-macos.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --timeout 30m \
            --wait

      - name: 装订票据并重新打包
        if: env.MACOS_CERT_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vvv -t exec "$APP_PATH"
          rm -f dist/Astra-macos.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Astra-macos.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Astra-macos
          path: dist/Astra-macos.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Astra-macos.zip
          generate_release_notes: true
